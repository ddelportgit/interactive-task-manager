<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <h1 class="heading">Task Manager</h1>
      <div class="inputs">
        <input type="text" class="taskInput" placeholder="Add a task..." />
        <button class="addTaskBtn">Add Task</button>
        <select class="taskFilter">
          <option>All</option>
          <option>Active</option>
          <option>Complete</option>
        </select>
      </div>
      <div class="tasks">
        <h2 class="taskAmount">Number of tasks: 1</h2>
        <ul class="taskList">
          <li>
            <div class="task">
              <input type="checkbox" />
              <p>Task Content</p>
              <p>Active</p>
              <button>Delete</button>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
